# sonar-project.properties
# ═══════════════════════════════════════════════════════════════════
# HappyPet - Configuracion SonarQube / SonarCloud
# ═══════════════════════════════════════════════════════════════════
# Requisitos:
#   1. SonarQube Server corriendo (local o SonarCloud)
#   2. sonar-scanner instalado
# ═══════════════════════════════════════════════════════════════════

# Identificacion del proyecto
sonar.projectKey=happypet
sonar.projectName=HappyPet - Sistema de Tienda de Mascotas
sonar.projectVersion=1.0
sonar.organization=happypet-org

# Codigo fuente
sonar.sources=.
sonar.inclusions=app.py
sonar.exclusions=tests/**,**/__pycache__/**,*.db,venv/**,node_modules/**

# Lenguaje
sonar.language=py
sonar.python.version=3

# Cobertura de tests (generada por pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Servidor (cambiar segun entorno)
# Local:      sonar.host.url=http://localhost:9000
# SonarCloud: sonar.host.url=https://sonarcloud.io
sonar.host.url=http://localhost:9000

# Token de autenticacion (reemplazar con token real)
# sonar.login=squ_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
